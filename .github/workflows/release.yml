name: Release Changelog

# Tags are the authoritative release version source. Push vMAJOR.MINOR.PATCH
# tags to generate the matching changelog entry and GitHub release. Manual
# dispatch accepts an existing tag for retry/recovery; it does not mint tags.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing semantic version tag to release (for recovery, e.g. v0.5.0)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  update-changelog:
    name: Generate CHANGELOG and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Resolve release tag
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.version }}" ]]; then
            TAG="${{ inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ ERROR: Release tag '$TAG' must match vMAJOR.MINOR.PATCH."
            exit 1
          fi

          VERSION="${TAG#v}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "❌ ERROR: Tag '$TAG' does not exist on origin. Create the tag before releasing."
            exit 1
          fi

          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install git-changelog
        run: pip install git-changelog

      - name: Generate changelog for release tag
        id: changelog
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          if grep -Eq "^## \[$TAG\]" CHANGELOG.md; then
            echo "CHANGELOG.md already contains $TAG; reusing existing release notes."
          else
            git-changelog
          fi

          awk -v tag="$TAG" '
            $0 ~ "^## \\[" tag "\\]" {found=1; print; next}
            found && /^## \[v?[0-9]+\.[0-9]+\.[0-9]+\]/ {exit}
            found {print}
          ' CHANGELOG.md > LATEST_CHANGELOG.md

          if [[ ! -s LATEST_CHANGELOG.md ]]; then
            echo "❌ ERROR: Could not find a CHANGELOG.md section for $TAG."
            exit 1
          fi

          if [[ -n "$(git status --porcelain CHANGELOG.md)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "docs: update changelog for $TAG"
            git push origin HEAD:main
          else
            echo "No changes to CHANGELOG.md, skipping commit."
          fi

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "⚠️ Release $TAG already exists. Skipping."
          else
            gh release create "$TAG" \
              --title "Release $TAG" \
              --notes-file LATEST_CHANGELOG.md
          fi
